name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            { grep -E "^e: " build.log | head -15; grep -A12 "What went wrong" build.log | head -30; } | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}' > err.txt
            echo "::error title=BuildErrors::$(cat err.txt)"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: StudyAlarm-apk
          path: app/build/outputs/apk/debug/app-debug.apk
